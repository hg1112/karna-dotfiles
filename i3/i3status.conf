general {
    colors = true
    interval = 5
    color_good     = "#b8bb26"
    color_degraded = "#fabd2f"
    color_bad      = "#fb4934"
}

order += "cpu_usage"
order += "memory"
order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "volume master"
order += "tztime local"

cpu_usage {
    format = " CPU %usage"
    max_threshold = 90
    degraded_threshold = 70
}

memory {
    format = " MEM %used / %total"
    threshold_degraded = "10%"
    threshold_critical = "5%"
    format_degraded = " MEM LOW: %free left"
}

disk "/" {
    format = " DISK %avail"
    threshold_type = "percentage_avail"
    low_threshold  = 10
}

wireless _first_ {
    format_up   = " %essid %quality"
    format_down = " down"
}

ethernet _first_ {
    format_up   = " %speed"
    format_down = ""
}

battery all {
    format                = "%status %percentage %remaining"
    format_down           = "No battery"
    status_chr            = " CHR"
    status_bat            = " BAT"
    status_unk            = "? UNK"
    status_full           = " FULL"
    low_threshold         = 15
    threshold_type        = percentage
    integer_battery_capacity = true
    last_full_capacity    = true
}

volume master {
    format       = " %volume"
    format_muted = " muted"
    device       = "default"
    mixer        = "Master"
    mixer_idx    = 0
}

tztime local {
    format = " %Y-%m-%d %H:%M"
}
